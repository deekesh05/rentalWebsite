<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>RentRide Signup</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
    rgba(0,0,0,0.55),
    rgba(0,0,0,0.7)
    ),

    url('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7')
    center/cover no-repeat;

    overflow:hidden;
}

/* ================= SIGNUP CARD ================= */

.signup-container{

    width:100%;
    max-width:450px;

    padding:40px;

    border-radius:22px;

    background:
    rgba(255,255,255,0.12);

    backdrop-filter:blur(14px);

    border:
    1px solid rgba(255,255,255,0.2);

    box-shadow:
    0 15px 40px rgba(0,0,0,0.3);

    color:white;

    animation:fadeIn 0.8s ease;
}

/* ================= LOGO ================= */

.logo{

    text-align:center;

    font-size:42px;

    margin-bottom:10px;
}

/* ================= TITLE ================= */

h2{

    text-align:center;

    font-weight:700;

    margin-bottom:8px;
}

.subtitle{

    text-align:center;

    color:#ddd;

    margin-bottom:30px;

    font-size:15px;
}

/* ================= INPUTS ================= */

.form-control{

    height:55px;

    border-radius:12px;

    border:none;

    background:
    rgba(255,255,255,0.18);

    color:white;

    padding-left:15px;

    margin-bottom:18px;
}

.form-control::placeholder{

    color:#ddd;
}

.form-control:focus{

    background:
    rgba(255,255,255,0.28);

    color:white;

    box-shadow:none;

    border:
    1px solid rgba(255,255,255,0.4);
}

/* ================= BUTTON ================= */

.btn-signup{

    height:55px;

    border-radius:12px;

    border:none;

    font-size:17px;

    font-weight:600;

    background:#0d6efd;

    color:white;

    transition:0.3s;
}

.btn-signup:hover{

    transform:translateY(-2px);

    background:#0b5ed7;
}

/* ================= LOGIN TEXT ================= */

.login-text{

    text-align:center;

    margin-top:20px;

    color:#eee;
}

.login-text a{

    color:#fff;

    font-weight:600;

    text-decoration:none;
}

.login-text a:hover{

    text-decoration:underline;
}

/* ================= ANIMATION ================= */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ================= MOBILE ================= */

@media(max-width:500px){

    .signup-container{

        margin:20px;

        padding:30px 25px;
    }

    h2{
        font-size:28px;
    }
}

</style>

</head>

<body>

<div class="signup-container">

<div class="logo">
<h2>🚗RentRide</h2>
</div>

<h2>Create Account</h2>

<p class="subtitle">
Join RentRide and start your journey today
</p>

<form action="signup.php" method="POST">

<input type="text"
name="name"
placeholder="Enter Your Name"
class="form-control"
required>

<input type="number"
name="mobile"
placeholder="Enter Phone Number"
class="form-control"
required>

<input type="email"
name="email"
placeholder="Enter Your Email"
class="form-control"
required>

<input type="password"
name="password"
placeholder="Enter Your Password"
class="form-control"
required>

<button type="submit"
name="signup"
class="btn btn-signup w-100">

Create Account

</button>

</form>

<p class="login-text">

Already have an account?

<a href="loginpage.php">

Login

</a>

</p>

</div>

</body>
</html>
